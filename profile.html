<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Smile Haus Reviews</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; color: #1a1a2e; }

    header {
      background: #1a1a2e; color: #fff; padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
    .header-brand .dot { width: 10px; height: 10px; background: #4ecdc4; border-radius: 50%; }
    .header-nav { display: flex; align-items: center; gap: 20px; }
    .header-nav a { color: #ccc; text-decoration: none; font-size: 14px; transition: color .15s; }
    .header-nav a:hover { color: #fff; }
    .header-nav a.active { color: #4ecdc4; font-weight: 600; }
    .user-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .user-bar .user-name { font-weight: 600; color: #fff; }
    .user-bar .user-role { color: #aaa; font-size: 12px; }
    .user-bar .btn-ghost {
      background: transparent; border: 1.5px solid #444; color: #ccc;
      border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .user-bar .btn-ghost:hover { border-color: #ccc; color: #fff; }

    main { max-width: 1000px; margin: 0 auto; padding: 36px 24px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #666; text-decoration: none; font-size: 13px; margin-bottom: 24px;
      transition: color .15s;
    }
    .back-link:hover { color: #1a1a2e; }

    .profile-header {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      padding: 28px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 20px;
    }
    .profile-avatar {
      width: 64px; height: 64px; background: #1a1a2e; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 22px; flex-shrink: 0;
    }
    .profile-info .name { font-size: 22px; font-weight: 700; }
    .profile-info .role { font-size: 13px; color: #888; margin-top: 2px; }
    .profile-info .offices { font-size: 13px; color: #666; margin-top: 6px; }
    .profile-stats { margin-left: auto; text-align: center; }
    .profile-stats .stat-num { font-size: 32px; font-weight: 700; color: #1a1a2e; }
    .profile-stats .stat-label { font-size: 12px; color: #888; }

    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

    .table-card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    thead tr { background: #f7f7f5; }
    th {
      padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; color: #888;
      border-bottom: 1.5px solid #eee; white-space: nowrap;
    }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafaf8; }

    .chip {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; background: #f0f0f0; color: #555;
    }
    .score-val { font-weight: 600; }
    .score-dash { color: #ccc; }

    .btn-action {
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; text-decoration: none; border: 1.5px solid transparent;
      transition: background .15s; white-space: nowrap;
    }
    .btn-clickup { background: #fff; color: #7b68ee; border-color: #d0caff; }
    .btn-clickup:hover { background: #f5f3ff; }

    .empty-state { text-align: center; padding: 56px 24px; color: #aaa; }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    .empty-state small { font-size: 13px; display: block; margin-top: 6px; }

    .spinner-inline {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid #ddd; border-top-color: #1a1a2e;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      main { padding: 20px 16px; }
      .header-nav { display: none; }
      .profile-stats { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand"><div class="dot"></div> Smile Haus Reviews</div>
  <nav class="header-nav">
    <a href="index.html">Home</a>
    <a href="records.html">Records</a>
    <a href="profiles.html" class="active">Profiles</a>
  </nav>
  <div class="user-bar" id="userBar"></div>
</header>

<main>
  <a class="back-link" href="profiles.html">← Back to Profiles</a>

  <div id="profileHeader">
    <div class="profile-header">
      <div class="spinner-inline"></div> Loading profile…
    </div>
  </div>

  <div class="section-title" style="margin-top:8px">Submitted Reviews</div>
  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Employee</th>
            <th>Office</th>
            <th>Form</th>
            <th>Score</th>
            <th>Band</th>
            <th>Review Date</th>
            <th>Submitted</th>
            <th>ClickUp</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="empty-state">
            <span class="spinner-inline"></span> Loading…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  const token = requireAuth();
  if (!token) throw new Error('auth');
  renderUserBar('#userBar');

  const me = parseJwtPayload(token);
  const uid = new URLSearchParams(location.search).get('uid') || me.uid;

  // Non-admins can only view their own profile
  if (me.role !== 'Admin' && uid !== me.uid) {
    window.location.href = 'profile.html?uid=' + encodeURIComponent(me.uid);
  }

  // Back link — non-admin goes home if they landed here directly
  if (me.role !== 'Admin') {
    document.querySelector('.back-link').href = 'index.html';
    document.querySelector('.back-link').textContent = '← Home';
  }

  async function load() {
    const res = await apiFetch('/profile/' + encodeURIComponent(uid));
    if (!res) return;
    const data = await res.json();

    if (!data.ok) {
      document.getElementById('profileHeader').innerHTML =
        `<p style="color:#c0392b">Could not load profile: ${escHtml(data.error || 'unknown error')}</p>`;
      return;
    }

    const u = data.user;
    const subs = data.submissions || [];
    const initials = u.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const roleLabel = u.role === 'Admin' ? 'Admin' : u.role === 'Regional' ? 'Regional Manager' : 'Office Manager';
    const offices = (u.offices || []).includes('*') ? 'All Offices' : (u.offices || []).join(', ');

    document.title = `${u.name} — Smile Haus Reviews`;

    document.getElementById('profileHeader').innerHTML = `
      <div class="profile-header">
        <div class="profile-avatar">${initials}</div>
        <div class="profile-info">
          <div class="name">${escHtml(u.name)}</div>
          <div class="role">${roleLabel}</div>
          <div class="offices">${escHtml(offices)}</div>
        </div>
        <div class="profile-stats">
          <div class="stat-num">${subs.length}</div>
          <div class="stat-label">reviews submitted</div>
        </div>
      </div>`;

    const tbody = document.getElementById('tableBody');
    if (!subs.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-state">
        <div class="icon">📋</div>
        <p>No reviews submitted yet.</p>
        <small>Reviews submitted from the forms will appear here automatically.</small>
      </td></tr>`;
      return;
    }

    tbody.innerHTML = subs.map(s => `
      <tr>
        <td>${escHtml(s.employee_name || '—')}</td>
        <td>${escHtml(s.office || '—')}</td>
        <td><span class="chip">${escHtml((s.form_type || '').toUpperCase() || '—')}</span></td>
        <td>${s.score && s.score !== '—' ? `<span class="score-val">${escHtml(s.score)}</span>` : '<span class="score-dash">—</span>'}</td>
        <td>${escHtml(s.band || '—')}</td>
        <td>${escHtml(s.review_date || '—')}</td>
        <td>${formatDate(s.submitted_at)}</td>
        <td>${s.task_url ? `<a class="btn-action btn-clickup" href="${escHtml(s.task_url)}" target="_blank">ClickUp ↗</a>` : '—'}</td>
      </tr>`).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  load();
</script>
</body>
</html>
